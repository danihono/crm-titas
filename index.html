<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Titãs CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- Tema, antes da primeira pintura.

       Precisa ser inline e SÍNCRONO: se o tema fosse aplicado só quando o
       bundle React roda, quem usa o modo escuro veria um lampejo branco a cada
       recarga. Lê a mesma chave que src/store/themeStore.ts grava.

       localStorage LANÇA no Safari em navegação privada — daí o try/catch. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('titas.theme');
        var sistema = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var escuro = v === 'dark' || ((v === null || v === 'system') && sistema);
        if (escuro) document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
