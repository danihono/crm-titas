<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- O "T" é o CONTORNO da Maharlika, não <text>. Um favicon é carregado como
       documento próprio: ele não enxerga o @font-face de src/index.css, então
       um <text font-family="Maharlika"> cairia no serif do sistema. O contorno
       desenha a letra da marca sem depender de fonte nenhuma.
       Gerado de public/fonts/Maharlika-Regular.woff2 (glifo T, unitsPerEm 1000).
       O scale negativo em Y inverte o eixo: na fonte o Y sobe, no SVG ele desce. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6fb8"/>
      <stop offset="1" stop-color="#5a3a7e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <g transform="translate(14.74 49) scale(0.04664 -0.04664)">
    <path d="M20 540 53 729H687L720 540H707Q698 590 679.0 624.0Q660 658 633.0 678.5Q606 699 572.0 707.5Q538 716 497 716H425V67Q425 32 442.0 22.5Q459 13 495 13V0H246V13Q282 13 298.5 22.5Q315 32 315 67V716H242Q202 716 168.0 707.5Q134 699 107.0 678.5Q80 658 61.0 624.0Q42 590 33 540Z" fill="#ffffff"/>
  </g>
</svg>
